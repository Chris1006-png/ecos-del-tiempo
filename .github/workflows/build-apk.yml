name: Compilar APK - Ecos del Tiempo

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Download Godot
      run: |
        mkdir -p ~/godot
        cd ~/godot
        wget -q https://github.com/godotengine/godot-releases/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
        unzip -q Godot_v4.3-stable_linux.x86_64.zip
        chmod +x Godot_v4.3-stable_linux.x86_64
        echo "GODOT_BIN=~/godot/Godot_v4.3-stable_linux.x86_64" >> $GITHUB_ENV
    
    - name: Setup Android SDK components
      run: |
        sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-34" "build-tools;34.0.0" --no_https 2>&1 | grep -E "Installed|Downloading" || true
    
    - name: Export APK
      run: |
        cd $GITHUB_WORKSPACE
        $GODOT_BIN --export-release Android ./ecos-del-tiempo.apk 2>&1 | tail -50
      continue-on-error: true
    
    - name: Check if APK exists
      run: |
        if [ -f "./ecos-del-tiempo.apk" ]; then
          echo "✓ APK compilado exitosamente"
          ls -lh ./ecos-del-tiempo.apk
        else
          echo "⚠ APK no encontrado, intentando alternativa..."
          find . -name "*.apk" -type f 2>/dev/null
        fi
    
    - name: Upload APK artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ecos-del-tiempo-apk
        path: |
          ./ecos-del-tiempo.apk
          ./**/*.apk
        retention-days: 30
