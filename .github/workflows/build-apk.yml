name: Compilar APK - Ecos del Tiempo

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Descargar código
      uses: actions/checkout@v3
    
    - name: Configurar Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Descargar Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-levels: '34'
        build-tools-version: '34.0.0'
    
    - name: Descargar Godot
      run: |
        mkdir -p ~/godot
        cd ~/godot
        wget -q https://github.com/godotengine/godot-releases/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
        unzip -q Godot_v4.3-stable_linux.x86_64.zip
        chmod +x Godot_v4.3-stable_linux.x86_64
        echo "GODOT_BIN=~/godot/Godot_v4.3-stable_linux.x86_64" >> $GITHUB_ENV
    
    - name: Compilar APK con Godot
      run: |
        $GODOT_BIN --export-release Android ./ecos-del-tiempo.apk
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
    
    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v3
      with:
        name: ecos-del-tiempo-apk
        path: ecos-del-tiempo.apk
        retention-days: 30
    
    - name: Crear Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ecos-del-tiempo.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
